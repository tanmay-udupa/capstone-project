<div class="app-layout" *ngIf="isAuthenticated$ | async; else loginView">
  <!-- Top Toolbar -->
  <mat-toolbar class="app-toolbar" color="primary">
    <button mat-icon-button (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="app-title">Pipeline Analyser</span>
    <span class="spacer"></span>
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ displayName }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-menu-header">
        <strong>{{ displayName }}</strong>
        <small>{{ email }}</small>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>
  </mat-toolbar>

  <!-- Sidenav + Content -->
  <mat-sidenav-container class="app-sidenav-container">
    <mat-sidenav #sidenav mode="side" opened class="app-sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/analyze" routerLinkActive="active-link">
          <mat-icon matListItemIcon>science</mat-icon>
          <span matListItemTitle>Analyze Pipeline</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content class="app-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<ng-template #loginView>
  <router-outlet></router-outlet>
</ng-template>
